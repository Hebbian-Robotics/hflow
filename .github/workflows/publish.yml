name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - name: Verify the release tag matches the package version
        run: |
          package_version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} must equal v${package_version}." >&2
            exit 1
          fi
      - name: Check both pinned Linux FFmpeg assets are available
        env:
          HFLOW_NETWORK_TESTS: "1"
        run: uv run --locked pytest tests/test_ffmpeg.py::test_pinned_release_assets_available -q
      - name: Verify downloaded binaries match the offline specifications
        env:
          HFLOW_NETWORK_TESTS: "1"
        run: uv run --locked pytest tests/test_ffmpeg.py::test_real_pinned_download_and_version -q
      - name: Build distributions
        run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.11 .release-venv
          wheel_path="$(printf '%s\n' dist/*.whl)"
          uv pip install --python .release-venv/bin/python "${wheel_path}[native-build]"
          .release-venv/bin/hflow --help
          .release-venv/bin/python scripts/smoke_test_lazy_imports.py
          .release-venv/bin/python scripts/smoke_test_installed_wheel.py
          package_root="$(.release-venv/bin/python -c \
            'from pathlib import Path; import hflow; print(Path(hflow.__file__).parent)')"
          .release-venv/bin/hflow package build \
            --package-root "${package_root}" \
            --module hflow.uri \
            --module hflow.packaging \
            --output-dir .release-native-overlay
          .release-venv/bin/hflow package apply .release-native-overlay \
            --target-package-root "${package_root}"
          .release-venv/bin/hflow package verify .release-native-overlay \
            --target-package-root "${package_root}"
          .release-venv/bin/python -c \
            'import hflow.uri, hflow.packaging; assert all(module.__file__.endswith(".so") for module in (hflow.uri, hflow.packaging))'
      - name: Upload distributions for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hflow
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

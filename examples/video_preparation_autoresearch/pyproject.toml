[project]
name = "hflow-video-preparation-autoresearch-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "hflow[video]",
    "numpy>=2.3.5",
    "pydantic>=2.13.4",
    "typer>=0.27.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.4", "ty>=0.0.74"]

[tool.uv]
package = false

[tool.uv.sources]
hflow = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["requires_system_ffmpeg: needs a system ffmpeg that supports -fps_mode (5.1+)"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ty.environment]
extra-paths = ["."]

[tool.ty.rules]
division-by-zero = "error"
deprecated = "error"
unused-ignore-comment = "error"
possibly-unresolved-reference = "error"
